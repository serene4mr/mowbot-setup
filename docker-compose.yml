# FROZEN (2026-10-03): this is the last version of the system as robots were
# installed until then. Every image is pinned by digest, so an install or an
# update from this branch always yields the same set. Do not move these pins;
# the next system is on the branch `next` and on release tags. See README.md.
services:
  mowbot_gui:
    # GUI of 2026-07-14 (commit 96ae224)
    image: ghcr.io/serene4mr/mowbot-gui:latest@sha256:e66832af25b672d7956b430f453f06dec2964e2336393e622c9d1fc3bd14db25
    container_name: mowbot_gui
    network_mode: host
    privileged: true
    group_add:
      - "133"
    environment:
      # If started by systemd, DISPLAY might be empty, so we default to :0
      - DISPLAY=${DISPLAY:-:0}
      - QTWEBENGINE_DISABLE_SANDBOX=1
      # Explicit paths inside the container mapped to the mounted volume
      - MBGUI_CONFIG=/etc/mowbot_data/gui_configs/config.yaml
      - MBGUI_MISSION_DIR=/etc/mowbot_data/missions
      - MBGUI_MANUFACTURER=${MB_MANUFACTURER:-MowbotTech}
      - MBGUI_SERIAL_NUMBER=${MB_ROBOT_ID:-mowbot_001}
      - MBGUI_MQTT_HOST=${MB_MQTT_HOST:-localhost}
      - MBGUI_MQTT_PORT=${MB_MQTT_PORT:-1883}
      - MBGUI_MQTT_USE_TLS=${MB_MQTT_USE_TLS:-false}
      - MBGUI_MQTT_USER=${MB_MQTT_USER:-}
      - MBGUI_MQTT_PASSWORD=${MB_MQTT_PASSWORD:-}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
    restart: always
    command: [ "python3", "/mowbot-gui/src/main.py" ]


  mowbot_uros_agent:
    # arm64 image of 2025-09-11, the one the base controller was tested with
    image: microros/micro-ros-agent:humble@sha256:16280d0753fdce81413ed6280b93f3a800582dd2230620408c86b1b24ecb0686
    container_name: mowbot_uros_agent
    network_mode: host
    stdin_open: true
    tty: true
    command:
      - udp4
      - --port
      - "8888"

  mowbot_bringup_and_sensing:
    image: ghcr.io/serene4mr/mowbot:devel-jetson-l4t-r36.4-latest@sha256:468e088357d446a2b64ded94e8aa72d626433d200e21c4326c1d3d8d0a0e9842
    container_name: mowbot_bringup_and_sensing
    # Keep the image's entrypoint (likely does ROS setup); only override command.
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0 # ensure DDS not restricted to loopback
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp  # uncomment if you want to force
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
      - /dev:/dev
    network_mode: host
    ipc: host # share host SHM for Fast DDS/Cyclone DDS
    pid: host # optional but recommended with SHM
    privileged: true
    command:
      - bash
      - -lc
      - |
        # Escape $ so Compose doesn't interpolate at parse-time; container bash expands it.
        source /opt/ros/$$ROS_DISTRO/setup.bash && \
        source /opt/mowbot/setup.bash && \
        # debug: show ROS env
        env | grep -E 'ROS_|RMW' || true
        # launch bringup and sensing
        ros2 launch mowbot_launch mowbot.launch.py \
          robot_id:=${MB_ROBOT_ID:-mowbot_001} \
          manufacturer:=${MB_MANUFACTURER:-MowbotTech} \
          robot_model:=${MB_ROBOT_MODEL:-mowbot_model_t2} \
          sensor_model:=${MB_SENSOR_MODEL:-mowbot_sensor_kit_t2} \
          data_path:=/etc/mowbot_data \
          launch_robot:=true launch_sensing:=true launch_sensing_driver:=true \
          launch_localization:=false launch_nav2:=false launch_app:=false

  mowbot_localization:
    image: ghcr.io/serene4mr/mowbot:devel-jetson-l4t-r36.4-latest@sha256:468e088357d446a2b64ded94e8aa72d626433d200e21c4326c1d3d8d0a0e9842
    container_name: mowbot_localization
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    command:
      - bash
      - -lc
      - |
        # Escape $ so Compose doesn't interpolate at parse-time; container bash expands it.
        source /opt/ros/$$ROS_DISTRO/setup.bash
        env | grep -E 'ROS_|RMW' || true
        ros2 launch mowbot_launch mowbot.launch.py \
          robot_id:=${MB_ROBOT_ID:-mowbot_001} \
          manufacturer:=${MB_MANUFACTURER:-MowbotTech} \
          robot_model:=${MB_ROBOT_MODEL:-mowbot_model_t2} \
          sensor_model:=${MB_SENSOR_MODEL:-mowbot_sensor_kit_t2} \
          data_path:=/etc/mowbot_data \
          launch_robot:=false launch_sensing:=false launch_sensing_driver:=false \
          launch_localization:=true launch_nav2:=false launch_app:=false

  mowbot_navigation:
    image: ghcr.io/serene4mr/mowbot:devel-jetson-l4t-r36.4-latest@sha256:468e088357d446a2b64ded94e8aa72d626433d200e21c4326c1d3d8d0a0e9842
    container_name: mowbot_navigation
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    command:
      - bash
      - -lc
      - |
        # Escape $ so Compose doesn't interpolate at parse-time; container bash expands it.
        source /opt/ros/$$ROS_DISTRO/setup.bash
        env | grep -E 'ROS_|RMW' || true
        export ROS_DOMAIN_ID=0
        ros2 launch mowbot_launch mowbot.launch.py \
          robot_id:=${MB_ROBOT_ID:-mowbot_001} \
          manufacturer:=${MB_MANUFACTURER:-MowbotTech} \
          robot_model:=${MB_ROBOT_MODEL:-mowbot_model_t2} \
          sensor_model:=${MB_SENSOR_MODEL:-mowbot_sensor_kit_t2} \
          data_path:=/etc/mowbot_data \
          launch_robot:=false launch_sensing:=false launch_sensing_driver:=false \
          launch_localization:=false launch_nav2:=true launch_app:=false

  mowbot_app:
    image: ghcr.io/serene4mr/mowbot:devel-jetson-l4t-r36.4-latest@sha256:468e088357d446a2b64ded94e8aa72d626433d200e21c4326c1d3d8d0a0e9842
    container_name: mowbot_app
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    command:
      - bash
      - -lc
      - |
        # Escape $ so Compose doesn't interpolate at parse-time; container bash expands it.
        source /opt/ros/$$ROS_DISTRO/setup.bash
        env | grep -E 'ROS_|RMW' || true
        ros2 launch mowbot_launch mowbot.launch.py \
          robot_id:=${MB_ROBOT_ID:-mowbot_001} \
          manufacturer:=${MB_MANUFACTURER:-MowbotTech} \
          robot_model:=${MB_ROBOT_MODEL:-mowbot_model_t2} \
          sensor_model:=${MB_SENSOR_MODEL:-mowbot_sensor_kit_t2} \
          data_path:=/etc/mowbot_data \
          launch_robot:=false launch_sensing:=false launch_sensing_driver:=false \
          launch_localization:=false launch_nav2:=false launch_app:=true

  mowbot_utility_webui:
    # panel of 2026-06-06
    image: ghcr.io/serene4mr/mowbot-utility-webui:latest@sha256:fddf3377278902852781b82691f80125fb36f728eb178c1925f8f5a5cb9077b7
    container_name: mowbot_utility_webui
    ports:
      - "8501:8501"
    environment:
      - MOWBOT_CONFIG_DIR=/etc/mowbot_data
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}:/etc/mowbot_data
    restart: always

  mowbot_mapproxy:
    # third-party image as of 2026-10-03
    image: kartoza/mapproxy:latest@sha256:fd998dab5f952df5baa73ba77978832ca382eee4471d463786692c58b18daee7
    container_name: mowbot_mapproxy
    ports:
      - "8080:8080"
    tty: true
    volumes:
      - ${MB_DATA_PATH:-/etc/mowbot_data}/mapproxy:/mapproxy
    restart: always
